# version: '3'

services:

  broker1:
    image: confluentinc/cp-kafka:7.4.0
    container_name: broker1
    hostname: broker1

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:29093 #,2@broker2:29093

      KAFKA_LISTENERS: PLAINTEXT://broker1:29092,CONTROLLER://broker1:29093,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker1:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    networks:
      - confluent

  # broker2:
  #   image: confluentinc/cp-kafka:7.4.0
  #   container_name: broker2
  #   hostname: broker2

  #   ports:
  #     - "9093:9092"

  #   environment:
  #     KAFKA_NODE_ID: 2
  #     KAFKA_PROCESS_ROLES: broker,controller

  #     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker1:29093,2@broker2:29093

  #     KAFKA_LISTENERS: PLAINTEXT://broker2:29092,CONTROLLER://broker2:29093,PLAINTEXT_HOST://0.0.0.0:9092

  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker2:29092,PLAINTEXT_HOST://localhost:9093

  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  #     CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  #   networks:
  #     - confluent

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.0

    container_name: schema-registry

    depends_on:
      - broker1
     # - broker2

    ports:
      - "8081:8081"
    volumes:
      - ./data/schema-registry:/var/lib/schema-registry

    environment:

      # Hostname inside Docker network
      SCHEMA_REGISTRY_HOST_NAME: schema-registry

      # Kafka brokers Schema Registry connects to
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker1:29092 #,PLAINTEXT://broker2:29092

      # API listener
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

    networks:
      - confluent

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.4.0

    container_name: control-center

    depends_on:
      - broker1
    #  - broker2

    ports:
      - "9021:9021"

    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: broker1:29092 #,broker2:29092

      CONTROL_CENTER_REPLICATION_FACTOR: 1

      PORT: 9021

    networks:
      - confluent
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9021/health" ]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
      image: postgres:14.0
      container_name: postgres
      environment:
        - POSTGRES_USER=airflow
        - POSTGRES_PASSWORD=airflow
        - POSTGRES_DB=airflow
      # OPTIMIZATION: Limits active internal database connections and buffers to save your host RAM
      command: postgres -c shared_buffers=128MB -c max_connections=20
      logging:
        options:
          max-size: 10m
          max-file: "3"
      networks:
        - confluent

  

  webserver:
    image: apache/airflow:2.6.0-python3.9
    container_name: airflow-webserver
    command: webserver
    entrypoint: ['/opt/airflow/script/entrypoint.sh']
    # user: root
    depends_on:
      postgres:
        condition: service_started
    environment:
      - LOAD_EX=n
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_WEBSERVER_SECRET_KEY=this_is_a_very_secured_key
      # OPTIMIZATION: Cuts web UI background RAM consumption completely in half
      - AIRFLOW__WEBSERVER__WORKERS=2
      - AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT=300
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entrypoint.sh:/opt/airflow/script/entrypoint.sh
      - ./requirements.txt:/opt/airflow/requirements.txt
    ports:
      - "8080:8080"
    healthcheck:
      test: ['CMD-SHELL', "[ -f /opt/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 30s
      retries: 3
    networks:
      - confluent

  scheduler:
    image: apache/airflow:2.6.0-python3.9
    container_name: airflow-scheduler
    # OPTIMIZATION: Uses your custom shell entrypoint instead of a raw bash string to maintain synchronization
    entrypoint: ['/opt/airflow/script/entrypoint.sh']
    # user: root
    command: scheduler
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - ./dags:/opt/airflow/dags
      - ./script/entrypoint.sh:/opt/airflow/script/entrypoint.sh
      - ./requirements.txt:/opt/airflow/requirements.txt
    environment:
      - LOAD_EX=n
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      - AIRFLOW_WEBSERVER_SECRET_KEY=this_is_a_very_secured_key
    networks:
      - confluent
    
  spark-master:
    image: apache/spark:3.5.0-python3
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master --host 0.0.0.0 --port 7077 --webui-port 8080
    # command: bin/spark-class org.apache.spark.deploy.master.Master
    # environment:
    #   - SPARK_MODE=master
    volumes:
      - ./:/opt/spark/apps
    environment:
      - SPARK_MASTER_MEMORY=512m
    ports:
      - "9090:8080"
      - "7077:7077"
    networks:
      - confluent
  spark-worker:
    image: apache/spark:3.5.0-python3
    container_name: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 --webui-port 8081
    depends_on:
      - spark-master
    ports : 
      - "8082:8081"
    environment:
      SPARK_MODE: worker
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 512m
    #   SPARK_MASTER_URL: spark://spark-master:7077
    networks:
      - confluent

  cassandra_db:
    image: cassandra:latest
    container_name: cassandra
    hostname: cassandra
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=256M
      - HEAP_NEWSIZE=64M
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - JVM_OPTS=-Dcassandra.available_processors=1 -Dcassandra.allocate_tokens_for_local_replication_factor=1
      - CASSANDRA_USERNAME=cassandra
      - CASSANDRA_PASSWORD=cassandra
    networks:
      - confluent
  spark-stream-job:
    image: apache/spark:3.5.0-python3
    container_name: spark-stream-job
    depends_on:
      - spark-master
      - broker1
      - cassandra_db
    volumes:
      - ./:/opt/spark/apps
      - ./jars:/opt/spark/jars/custom
    environment:
      - PYTHONPATH=/opt/spark/apps
      - HOME=/tmp
    # 🟢 Clean single-line execution fixes formatting bugs and adds driver memory
    # command: bash -c "pip install --no-cache-dir cassandra-driver && /opt/spark/bin/spark-submit --master spark://spark-master:7077 --conf 'spark.driver.extraJavaOptions=-Divy.home=/tmp' --conf 'spark.executor.extraJavaOptions=-Divy.home=/tmp' --conf 'spark.driver.memory=512m' --conf 'spark.executor.memory=512m' --jars /opt/spark/jars/custom/spark-cassandra-connector_2.12-3.5.0.jar /opt/spark/apps/spark_stream.py"
    # 🟢 Swapped --jars for --packages to automatically resolve all hidden Kafka/Avro dependencies
    command: bash -c "pip install --no-cache-dir cassandra-driver && /opt/spark/bin/spark-submit --master spark://spark-master:7077 --conf 'spark.driver.extraJavaOptions=-Divy.home=/tmp' --conf 'spark.executor.extraJavaOptions=-Divy.home=/tmp' --conf 'spark.driver.memory=512m' --conf 'spark.executor.memory=512m' --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.apache.spark:spark-avro_2.12:3.5.0,com.datastax.spark:spark-cassandra-connector_2.12:3.5.0 /opt/spark/apps/spark_stream.py"
    networks:
      - confluent
    restart: always

networks:
  confluent: